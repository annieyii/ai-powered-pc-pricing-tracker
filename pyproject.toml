[project]
name = "pc-price-tracker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.13.0",
    "pandas>=2.3.3",
    "plotly>=7.0.0",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
